<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    
    <link rel="shortcut icon" href="./images/favicon(1).ico" type="image/x-icon">
</head>

<body class="bg-black">

    <nav class="navbar d-flex justify-content-between align-items-center px-4 fixed-top">
        <div>
            <a href="home.html">
                <img src="./images/logo.png" alt="" class="logo">
            </a>
        </div>
        <div>
            <div class="search-container">
                <i class="bi bi-search search-icon"></i>
                <input type="search" placeholder="Search Anime.." class="custom-input bg-black text-light form-control"
                    id="searchInput">
            </div>
        </div>
        <div>
            <ul class="navbar-nav  mb-lg-0 d-flex gap-3 ms-auto flex-row">
                <li><button type="button" class="btn text-white  my-btn">Sign In</button></li>
            </ul>
        </div>
    </nav>


    <div id="details-wrapper" class="d-flex justify-content-center align-items-start placeholder-glow p-4" >
    
    <div id="image-details" class="placeholder bg-secondary rounded-3 w-25 flex-shrink-0 h-100" ></div>
    
    <div id="text-details" class="ps-4 w-75">
        <h2 class="placeholder col-6 bg-secondary rounded mb-3 py-3" ></h2>
        <p class="placeholder col-12 bg-secondary rounded py-2" ></p>
        <p class="placeholder col-9 bg-secondary rounded py-2" ></p>
    </div>
</div>


    <script src="details.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
