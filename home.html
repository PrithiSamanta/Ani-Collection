<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ani Collection - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./images/favicon(1).ico" type="image/png">

</head>

<body class="bg-black">

    <div class="main">
        <nav class="navbar d-flex justify-content-between align-items-center pe-5">
            <div>
                <a href="home.html">
                    <img src="./images/logo.png" alt="" class="logo">
                </a>
            </div>
            <div>
                <div class="search-container">
                    <i class="bi bi-search search-icon"></i>
                    <input type="search" placeholder="Search Anime.."
                        class="custom-input bg-black text-light form-control" id="searchInput">
                </div>

            </div>
            <div>
                <ul class="navbar-nav  mb-lg-0 d-flex gap-3 ms-auto flex-row">
                    <li><button type="button" class="btn text-white  my-btn">Sign In</button></li>
                </ul>
            </div>
        </nav>

        <div class="top-airing-wrapper">
            <div class="top-airing">


                <div id="carouselExampleIndicators" class="carousel slide h-100 " data-bs-ride="carousel">


                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                            class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                            aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                            aria-label="Slide 3"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3"
                            aria-label="Slide 4"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="4"
                            aria-label="Slide 5"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="5"
                            aria-label="Slide 6"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="6"
                            aria-label="Slide 7"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="7"
                            aria-label="Slide 8"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="8"
                            aria-label="Slide 9"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="9"
                            aria-label="Slide 10"></button>
                    </div>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <div class="carousel-binder">
                                <div class="d-block w-100 carousel-banner-img bg-dark placeholder"
                                    style="height: 600px;"></div>

                                <div
                                    class="carousel-caption d-flex flex-column justify-content-center align-items-start text-start px-4 py-3 rounded placeholder-glow">
                                    <h2 class="fw-bold display-4 mb-5 placeholder-glow col-7 bg-secondary rounded"
                                        style="max-width: 60%; height: 50px;"></h2>

                                    <div class="status-div mb-5">
                                        <span
                                            class="badge badge-meta me-2 bg-dark text-warning border border-secondary border-opacity-50">★
                                            Loading...</span>
                                        <span
                                            class="badge badge-meta me-2 bg-dark text-light border border-secondary border-opacity-50"><i
                                                class="bi bi-play-btn-fill me-1"></i>Episodes: Loading</span>
                                        <span
                                            class="badge badge-meta me-2 bg-dark text-info border border-secondary border-opacity-50">Checking
                                            Status</span>
                                    </div>

                                    <p class="line-clamp placeholder col-12 bg-secondary rounded mb-2"
                                        style="max-width: 50%;"></p>
                                    <p class="line-clamp placeholder col-9 bg-secondary rounded mb-4"
                                        style="max-width: 50%;"></p>

                                    <button
                                        class="btn text-white btn-lg fs-4 fw-bold placeholder disabled col-3 btn-danger" id="view-details"></button>
                                </div>
                            </div>
                        </div>
                        <div class="carousel-item">
                        </div>
                        <div class="carousel-item">
                        </div>
                        <div class="carousel-item">
                        </div>
                        <div class="carousel-item">

                        </div>
                        <div class="carousel-item">

                        </div>
                        <div class="carousel-item">

                        </div>
                        <div class="carousel-item">

                        </div>
                        <div class="carousel-item">

                        </div>
                        <div class="carousel-item">

                        </div>
                    </div>
                    <button class="carousel-control-prev mb-5 z-2" type="button"
                        data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon " aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next mb-5 z-2" type="button"
                        data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="top-rated anime-section mb-2">
        <div class="d-flex justify-content-between">
            <h3 class="text-white ps-2 my-1 mx-1">Top Rated</h3>
            <div class="align-self-end">
                <button class="left-scroll btn btn-outline-danger btn-sm" data-target="#top-container"><i
                        class="bi bi-arrow-left"></i></button>
                <button class="right-scroll btn btn-outline-danger btn-sm" data-target="#top-container"><i
                        class="bi bi-arrow-right"></i></button>
            </div>
        </div>
        <div class="card-wrapper  d-flex overflow-x-auto gap-4 py-3 px-1 loading-skeleton" id="top-container">
        </div>
    </div>

    </div>

    <div class="all-time-classics anime-section mb-2">
        <div class="d-flex justify-content-between">
            <h3 class="text-white ps-2 my-1 mx-1">All-Time Classics</h3>
            <div class="align-self-end">
                <button class="left-scroll btn btn-outline-danger btn-sm" data-target="#classic-container"><i
                        class="bi bi-arrow-left"></i></button>
                <button class="right-scroll btn btn-outline-danger btn-sm" data-target="#classic-container"><i
                        class="bi bi-arrow-right"></i></button>
            </div>
        </div>

        <div class="card-wrapper  d-flex overflow-x-auto gap-4 py-3 px-1 loading-skeleton" id="classic-container">

        </div>
    </div>

    <div class="anime-section coming-soon mb-2">
        <div class="d-flex justify-content-between">
            <h3 class="text-white ps-2 my-1 mx-1">Coming soon</h3>
            <div class="align-self-end">
                <button class="left-scroll btn btn-outline-danger btn-sm" data-target="#upcoming-container"><i
                        class="bi bi-arrow-left"></i></button>
                <button class="right-scroll btn btn-outline-danger btn-sm" data-target="#upcoming-container"><i
                        class="bi bi-arrow-right"></i></button>
            </div>
        </div>

        <div class="card-wrapper  d-flex overflow-x-auto gap-4 py-3 px-1 loading-skeleton" id="upcoming-container">

        </div>
    </div>




    <div
        class="bottom-nav d-flex justify-content-between align-items-center px-3 py-1 m-2 position-fixed bottom-0 bg-dark rounded-3 d-none">
        <a href="home.html"
            class="home text-decoration-none text-white d-flex justify-content-between align-items-center flex-column">
            <i class="bi bi-house-fill "></i>
            <p>Home</p>
        </a>
        <a href="search.html"
            class="search text-decoration-none text-white d-flex justify-content-between align-items-center flex-column">
            <i class="bi bi-search"></i>
            <p>Search</p>
        </a>
        <a href="profile.html"
            class="profile text-decoration-none text-white d-flex justify-content-between align-items-center flex-column">
            <i class="bi bi-person-circle"></i>
            <p>Profile</p>
        </a>
    </div>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
