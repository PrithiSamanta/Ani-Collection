<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ani Collection</title>
    <meta name="description" content="Search through thousands of anime titles on Ani Collection. Filter by genres, ratings, or production studios, and instantly add new discoveries to your watchlist.">
    <meta name="keywords" content="search anime, find anime, catalog exploration, discover titles">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="search.css">

    <link rel="shortcut icon" href="./images/favicon(1).ico" type="image/x-icon">
</head>

<body class="bg-black">
    <nav class="navbar d-flex justify-content-between align-items-center px-4 fixed-top">
    <div>
      <a href="home.html">
        <img src="./images/logo.webp" alt="Ani Collection logo" class="logo">
      </a>
    </div>
    <div>
      <div class="search-container">
        <i class="bi bi-search search-icon"></i>
        <input type="search" placeholder="Search Anime.." class="custom-input bg-black text-light form-control"
          id="searchInput" autocomplete="off">
      </div>
    </div>
    <div id="nav-auth-container" class="ms-5">
      <button type="button" class="btn text-white my-btn" data-bs-toggle="modal" data-bs-target="#signInModal">Sign
        In</button>
    </div>
  </nav>

    <div class="search-container-sm d-none ">
        <i class="bi bi-search search-icon"></i>
        <input type="search" placeholder="Search Anime.." class="custom-input bg-black text-light form-control"
            id="searchInput-sm" autocomplete="off" autocorrect="off">
    </div>

    <h2 class="text-white mx-4"></h2>
    <div class="grid-container-search mx-4" role="main">
<!-- js dyamic Loading -->
    </div>




    <div
        class="bottom-nav d-flex justify-content-between align-items-center px-3 py-1 m-2 position-fixed bottom-0 bg-black rounded-3 d-none z-2">
        <a href="home.html"
            class="home text-decoration-none text-white d-flex justify-content-between align-items-center flex-column">
            <i class="bi bi-house-fill "></i>
            <p>Home</p>
        </a>
        <a href="search.html"
            class="search text-decoration-none text-white d-flex justify-content-between align-items-center flex-column">
            <i class="bi bi-search"></i>
            <p>Search</p>
        </a>
        <a href="profile.html"
            class="profile text-decoration-none text-white d-flex justify-content-between align-items-center flex-column">
            <i class="bi bi-person-circle"></i>
            <p>Profile</p>
        </a>
    </div>


    <div class="modal fade text-white" id="signUpModal" tabindex="-1" aria-hidden="true" data-bs-theme="dark">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-black">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold fs-4 ">Create an Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="signUpForm">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" id="signUpEmail" class="form-control custom-input bg-black"
                                placeholder="name@example.com" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="signUpPassword" class="form-control custom-input bg-black"
                                placeholder="At least 6 characters" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control custom-input bg-black"
                                placeholder="Confirm Password" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn my-btn  w-100 py-2 mt-2 ">Sign Up</button>
                    </form>
                </div>
                <p class="ms-3 text-secondary">Already have an account ? <a href="" class="opacity-75"
                        data-bs-toggle="modal" data-bs-target="#signInModal" style="color: var(--accent-color);">Sign
                        in</a>
                </p>
            </div>
        </div>
    </div>

    <div class="modal fade text-white" id="signInModal" tabindex="-1" aria-hidden="true" data-bs-theme="dark">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-black border-secondary">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold fs-4">Login back to your account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="signInForm">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" id="signInEmail" class="form-control bg-black custom-input"
                                placeholder="name@example.com" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="signInPassword" class="form-control bg-black custom-input"
                                placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-light w-100 py-2 mt-2 my-btn text-white">Sign in</button>
                    </form>
                </div>
                <p class="ms-3 text-secondary">Don't have an account ? <a href="" data-bs-toggle="modal"
                        class="opacity-75" data-bs-target="#signUpModal" style="color: var(--accent-color);">Sign up</a>
                </p>
            </div>
        </div>
    </div>


    <div style="height: 100px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="search.js"></script>
    <script src="global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
