<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ani Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="search.css">
    <link rel="shortcut icon" href="./images/favicon(1).ico" type="image/x-icon">
</head>

<body class="bg-black">

    <nav class="navbar navbar-expand-lg bg-body-black ">
        <div class="container-fluid d-flex justify-content-between align-item-center" id="nav-div">
            <a class="navbar-brand" href="#">
                <img src="./images/logo.png" alt="" class="logo">
            </a>

            <div id="nav-auth-container">

                <button type="button" class="btn text-white  my-btn" data-bs-toggle="modal"
                    data-bs-target="#signInModal">Sign In</button>

            </div>
        </div>
    </nav>

    <div class="hero d-flex justify-content-center align-items-center">
        <div class="hero-cont d-flex flex-column gap-5 ">
            <h1 class="text-white text-center fw-bolder display-4 hero-title">Your Anime Tracking Journey Starts Here
            </h1>
            <div id="search-anime" class="d-flex gap-2 px-4">

                <input type="text" placeholder="Search Anime" class="custom-input bg-black text-light form-control"
                    id="searchInput" autocomplete="off">
                <button class="btn text-white fw-sem-bold fs-3 my-btn" type="button" id="search-btn">Search</button>
            </div>
        </div>
    </div>


    <div class="modal fade text-white" id="signUpModal" tabindex="-1" aria-hidden="true" data-bs-theme="dark">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-black">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold fs-4 ">Create an Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="signUpForm">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" id="signUpEmail" class="form-control custom-input bg-black"
                                placeholder="name@example.com" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="signUpPassword" class="form-control custom-input bg-black"
                                placeholder="At least 6 characters" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control custom-input bg-black"
                                placeholder="Confirm Password" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn my-btn  w-100 py-2 mt-2 ">Sign Up</button>
                    </form>
                </div>
                <p class="ms-3 text-secondary">Already have an account ? <a href="" class="opacity-75"
                        data-bs-toggle="modal" data-bs-target="#signInModal" style="color: var(--accent-color);">Sign
                        in</a>
                </p>
            </div>
        </div>
    </div>

    <div class="modal fade text-white" id="signInModal" tabindex="-1" aria-hidden="true" data-bs-theme="dark">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-black border-secondary">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold fs-4">Login back to your account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="signInForm">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" id="signInEmail" class="form-control bg-black custom-input"
                                placeholder="name@example.com" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="signInPassword" class="form-control bg-black custom-input"
                                placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-light w-100 py-2 mt-2 my-btn text-white">Sign in</button>
                    </form>
                </div>
                <p class="ms-3 text-secondary">Don't have an account ? <a href="" data-bs-toggle="modal"
                        class="opacity-75" data-bs-target="#signUpModal" style="color: var(--accent-color);">Sign up</a>
                </p>
            </div>
        </div>
    </div>


    <div style="height: 100px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="global.js"></script>
    <script src="script.js"></script>
</body>

</html>
